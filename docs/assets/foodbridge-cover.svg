<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">FoodBridge Agent cover image</title>
  <desc id="desc">A structured food rescue dispatch workflow showing donors, an approval-gated AI agent, MCP recipient search, safety checks, and recipient organizations.</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f8fafc"/>
      <stop offset="0.52" stop-color="#eef7f0"/>
      <stop offset="1" stop-color="#eaf1fb"/>
    </linearGradient>
    <linearGradient id="agent" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0f766e"/>
      <stop offset="1" stop-color="#2563eb"/>
    </linearGradient>
    <filter id="softShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="16" stdDeviation="20" flood-color="#0f172a" flood-opacity="0.16"/>
    </filter>
  </defs>

  <rect width="1600" height="900" fill="url(#background)"/>
  <rect x="64" y="64" width="1472" height="772" rx="36" fill="#ffffff" opacity="0.82"/>

  <g transform="translate(112 116)">
    <text x="0" y="0" fill="#0f172a" font-family="Inter, Arial, sans-serif" font-size="76" font-weight="800">FoodBridge Agent</text>
    <text x="0" y="58" fill="#334155" font-family="Inter, Arial, sans-serif" font-size="34" font-weight="600">Multi-Agent Food Rescue Dispatch with ADK + MCP</text>
    <text x="0" y="104" fill="#475569" font-family="Inter, Arial, sans-serif" font-size="24">Safety triage, recipient matching, approval gates, persistence, and evals for surplus food rescue.</text>
  </g>

  <g transform="translate(130 315)">
    <rect x="0" y="0" width="314" height="250" rx="24" fill="#fff7ed" stroke="#fb923c" stroke-width="3" filter="url(#softShadow)"/>
    <text x="34" y="54" fill="#9a3412" font-family="Inter, Arial, sans-serif" font-size="28" font-weight="800">Donor Intake</text>
    <text x="34" y="98" fill="#431407" font-family="Inter, Arial, sans-serif" font-size="22">18 sealed sandwiches</text>
    <text x="34" y="132" fill="#431407" font-family="Inter, Arial, sans-serif" font-size="22">12 garden salads</text>
    <text x="34" y="166" fill="#431407" font-family="Inter, Arial, sans-serif" font-size="22">Refrigerated until 8:30 PM</text>
    <rect x="34" y="194" width="170" height="34" rx="17" fill="#fed7aa"/>
    <text x="54" y="218" fill="#9a3412" font-family="Inter, Arial, sans-serif" font-size="18" font-weight="700">Untrusted input</text>
  </g>

  <g transform="translate(622 280)" filter="url(#softShadow)">
    <rect x="0" y="0" width="356" height="320" rx="34" fill="url(#agent)"/>
    <text x="42" y="62" fill="#ffffff" font-family="Inter, Arial, sans-serif" font-size="34" font-weight="800">FoodBridge</text>
    <text x="42" y="104" fill="#dbeafe" font-family="Inter, Arial, sans-serif" font-size="24" font-weight="700">Approval-gated agent</text>
    <g transform="translate(42 140)">
      <rect x="0" y="0" width="272" height="44" rx="14" fill="#ffffff" opacity="0.18"/>
      <text x="18" y="29" fill="#ffffff" font-family="Inter, Arial, sans-serif" font-size="20" font-weight="700">ADK root agent</text>
      <rect x="0" y="58" width="272" height="44" rx="14" fill="#ffffff" opacity="0.18"/>
      <text x="18" y="87" fill="#ffffff" font-family="Inter, Arial, sans-serif" font-size="20" font-weight="700">Food-safety skill</text>
      <rect x="0" y="116" width="272" height="44" rx="14" fill="#ffffff" opacity="0.18"/>
      <text x="18" y="145" fill="#ffffff" font-family="Inter, Arial, sans-serif" font-size="20" font-weight="700">State machine + SQLite</text>
    </g>
  </g>

  <g transform="translate(1156 315)">
    <rect x="0" y="0" width="314" height="250" rx="24" fill="#ecfeff" stroke="#0891b2" stroke-width="3" filter="url(#softShadow)"/>
    <text x="34" y="54" fill="#0e7490" font-family="Inter, Arial, sans-serif" font-size="28" font-weight="800">Recipient Match</text>
    <text x="34" y="98" fill="#164e63" font-family="Inter, Arial, sans-serif" font-size="22">Shelter capacity</text>
    <text x="34" y="132" fill="#164e63" font-family="Inter, Arial, sans-serif" font-size="22">Distance and pickup fit</text>
    <text x="34" y="166" fill="#164e63" font-family="Inter, Arial, sans-serif" font-size="22">Accepted food categories</text>
    <rect x="34" y="194" width="178" height="34" rx="17" fill="#bae6fd"/>
    <text x="54" y="218" fill="#0e7490" font-family="Inter, Arial, sans-serif" font-size="18" font-weight="700">MCP directory</text>
  </g>

  <path d="M 456 440 C 516 440, 548 440, 606 440" fill="none" stroke="#64748b" stroke-width="7" stroke-linecap="round"/>
  <polygon points="606,440 580,424 580,456" fill="#64748b"/>
  <path d="M 992 440 C 1052 440, 1082 440, 1140 440" fill="none" stroke="#64748b" stroke-width="7" stroke-linecap="round"/>
  <polygon points="1140,440 1114,424 1114,456" fill="#64748b"/>

  <g transform="translate(197 650)">
    <rect x="0" y="0" width="242" height="74" rx="18" fill="#fef2f2" stroke="#ef4444" stroke-width="2"/>
    <text x="28" y="46" fill="#991b1b" font-family="Inter, Arial, sans-serif" font-size="22" font-weight="800">Prompt-injection scan</text>
  </g>
  <g transform="translate(487 650)">
    <rect x="0" y="0" width="210" height="74" rx="18" fill="#ecfdf5" stroke="#10b981" stroke-width="2"/>
    <text x="30" y="46" fill="#047857" font-family="Inter, Arial, sans-serif" font-size="22" font-weight="800">Safety triage</text>
  </g>
  <g transform="translate(747 650)">
    <rect x="0" y="0" width="210" height="74" rx="18" fill="#eff6ff" stroke="#3b82f6" stroke-width="2"/>
    <text x="30" y="46" fill="#1d4ed8" font-family="Inter, Arial, sans-serif" font-size="22" font-weight="800">Approval gate</text>
  </g>
  <g transform="translate(1007 650)">
    <rect x="0" y="0" width="210" height="74" rx="18" fill="#f8fafc" stroke="#64748b" stroke-width="2"/>
    <text x="38" y="46" fill="#334155" font-family="Inter, Arial, sans-serif" font-size="22" font-weight="800">Trace + evals</text>
  </g>

  <g transform="translate(112 792)">
    <text x="0" y="0" fill="#475569" font-family="Inter, Arial, sans-serif" font-size="22" font-weight="700">Agents for Good</text>
    <text x="188" y="0" fill="#94a3b8" font-family="Inter, Arial, sans-serif" font-size="22">|</text>
    <text x="218" y="0" fill="#475569" font-family="Inter, Arial, sans-serif" font-size="22">Synthetic data, no live sends, reproducible local demo</text>
  </g>
</svg>
