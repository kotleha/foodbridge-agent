[build-system]
requires = ["setuptools>=80"]
build-backend = "setuptools.build_meta"

[project]
name = "foodbridge-agent"
version = "0.1.0"
description = "FoodBridge Agent MVP for the Kaggle AI Agents capstone."
readme = "README.md"
requires-python = ">=3.12"
dependencies = []

[project.optional-dependencies]
agent = [
  "google-adk",
  "mcp",
]
web = [
  "fastapi>=0.138,<0.139",
  "uvicorn>=0.49,<0.50",
]
dev = [
  "httpx2",
  "pytest>=9.1,<10",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.setuptools.packages.find]
include = [
  "app*",
  "foodbridge_agent*",
  "mcp_servers*",
]

[tool.setuptools.package-data]
app = [
  "static/*",
]
